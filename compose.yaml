# Meniru susunan service di Easypanel: satu App + satu Postgres.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: undangan
      POSTGRES_PASSWORD: undangan
      POSTGRES_DB: undangan
    ports:
      - "${DB_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U undangan -d undangan"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://undangan:undangan@db:5432/undangan
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
